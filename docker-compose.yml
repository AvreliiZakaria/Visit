services:
  verdict:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-too}
      JURY_SIZE: 100
      MIN_QUORUM: 20
    volumes:
      - verdict-data:/data
    restart: unless-stopped

volumes:
  verdict-data:
